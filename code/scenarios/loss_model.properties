# Demonstration parameters, not a calibrated model of a deployed constellation.
# event_seed: nonnegative 64-bit seed for independent satellite event timelines.
# satellites: all or comma-separated satellite IDs; controls peak events only.
# link_types: isl, gsl, or isl,gsl; base errors affect all links of these types.
# base_loss_probability: normal packet-error probability per link traversal [0,1].
# peak_loss_probability: disturbance error probability [base_loss_probability,1].
# peak_probability_per_second: probability of entering a peak within one second
# of normal operation [0,1), NOT a per-packet probability.
# peak_duration_min_ms/peak_duration_max_ms: positive uniform duration bounds;
# equal bounds give a fixed duration. See gen_loss_state.py for event generation.
#
# Peak probability applies if the satellite sender is disturbed at transmission
# or satellite receiver at reception. Two disturbed endpoints still use one peak
# probability. Both data and ACKs are eligible. Packet draws are independent per
# directed link, controlled by simulation_seed (--seed in prepare_run.py), separate
# from event_seed. The same timeline can be replayed with different TCP variants.
# Models residual burst errors after unspecified link protection, not attitude
# control, coding, ARQ, or an optical/RF physical channel. Final report parameters
# need support from literature or measurements.
event_seed=42
satellites=all
link_types=isl
base_loss_probability=0.00001
peak_loss_probability=0.20
peak_probability_per_second=0.02
peak_duration_min_ms=20
peak_duration_max_ms=200
